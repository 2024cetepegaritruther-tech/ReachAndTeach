<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REACH & TEACH — User Access System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =====================================================
     WELCOME SCREEN
===================================================== -->

<section id="welcomeScreen" class="process-screen active">

    <div class="welcome-container">

        <div class="welcome-card">

            <h1>REACH & TEACH</h1>

            <p>User Access Management System</p>

            <div class="welcome-buttons">

                <button
                    type="button"
                    class="primary-btn"
                    id="goLoginBtn">
                    LOG IN
                </button>

                <button
                    type="button"
                    class="secondary-btn"
                    id="goSignupBtn">
                    SIGN UP
                </button>

            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     LOGIN SCREEN
===================================================== -->

<section id="loginScreen" class="process-screen">

    <div class="login-wrapper">

        <!-- TOP BAR -->
        <div class="login-top-bar">
            <span></span>
            <span></span>
            <span></span>
        </div>


        <div class="login-content">

            <!-- USER ICON + SYSTEM NAME -->

            <div class="login-icon">

                <div class="user-head"></div>

                <div class="user-body"></div>

                <div class="system-name">
                    REACH & TEACH
                </div>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm" novalidate>

                <!-- EMAIL -->

                <div class="login-field">

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Email Address"
                        autocomplete="email"
                        required>

                    <small
                        class="login-error"
                        id="loginEmailError">
                    </small>

                </div>


                <!-- PASSWORD -->

                <div class="login-field">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        autocomplete="current-password"
                        required>

                    <small
                        class="login-error"
                        id="loginPasswordError">
                    </small>

                </div>


                <!-- FORGOT PASSWORD -->

                <button
                    type="button"
                    id="forgotPasswordBtn"
                    class="forgot-password-btn">

                    Forgot Password?

                </button>


                <!-- LOGIN MESSAGE -->

                <div
                    id="loginMessage"
                    class="form-message">
                </div>


                <!-- CONTINUE -->

                <button
                    type="submit"
                    class="continue-btn">

                    CONTINUE

                </button>

            </form>


            <!-- OR CONTINUE WITH -->

            <div class="or-divider">

                <span>or continue with</span>

            </div>


            <!-- GOOGLE LOGIN -->

            <button
                type="button"
                id="googleLoginBtn"
                class="google-login-btn">

                <span class="google-icon">G</span>

                <span>Continue with Google</span>

            </button>


            <!-- BACK -->

            <button
                type="button"
                class="login-back-btn"
                id="backToWelcomeBtn">

                Back

            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     SIGN UP SCREEN
===================================================== -->

<section id="signupScreen" class="process-screen">

    <div class="process-container">

        <div class="process-header">

            <h1>REACH & TEACH</h1>

            <p>
                User Access Management System
            </p>

        </div>


        <div class="process-card">

            <h2>Add New User</h2>

            <p class="description">
                Create a new user account and enter the required information.
            </p>


            <form id="signupForm" novalidate>


                <!-- =========================
                     PERSONAL INFORMATION
                ========================== -->

                <h3 class="section-title">
                    Personal Information
                </h3>


                <div class="form-row">

                    <div class="form-group">

                        <label for="userId">
                            User ID <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="userId"
                            readonly>

                        <small class="field-hint">
                            Automatically generated.
                        </small>

                        <small
                            class="error-message"
                            id="userIdError">
                        </small>

                    </div>


                    <div class="form-group">

                        <label for="birthday">
                            Birthday <span>*</span>
                        </label>

                        <input
                            type="date"
                            id="birthday"
                            required>

                        <small
                            class="error-message"
                            id="birthdayError">
                        </small>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="lastName">
                            Last Name <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            placeholder="Enter last name"
                            required>

                        <small
                            class="error-message"
                            id="lastNameError">
                        </small>

                    </div>


                    <div class="form-group">

                        <label for="firstName">
                            First Name <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            placeholder="Enter first name"
                            required>

                        <small
                            class="error-message"
                            id="firstNameError">
                        </small>

                    </div>

                </div>


                <!-- =========================
                     ACCOUNT INFORMATION
                ========================== -->

                <h3 class="section-title">
                    Account Information
                </h3>


                <div class="form-row">

                    <div class="form-group">

                        <label for="username">
                            Username <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter username"
                            required>

                        <small
                            class="error-message"
                            id="usernameError">
                        </small>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email <span>*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email"
                            required>

                        <small
                            class="error-message"
                            id="emailError">
                        </small>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="password">
                            Password <span>*</span>
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Minimum 8 characters"
                            required>

                        <small
                            class="error-message"
                            id="passwordError">
                        </small>

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password <span>*</span>
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Re-enter password"
                            required>

                        <small
                            class="error-message"
                            id="confirmPasswordError">
                        </small>

                    </div>

                </div>


                <!-- =========================
                     ADDRESS
                ========================== -->

                <h3 class="section-title">
                    Address
                </h3>


                <div class="form-row">

                    <div class="form-group">

                        <label for="country">
                            Country <span>*</span>
                        </label>

                        <select
                            id="country"
                            required>

                            <option value="">
                                Select Country
                            </option>

                            <option value="Philippines">
                                Philippines
                            </option>

                        </select>

                        <small
                            class="error-message"
                            id="countryError">
                        </small>

                    </div>


                    <div class="form-group">

                        <label for="province">
                            Province <span>*</span>
                        </label>

                        <select
                            id="province"
                            required
                            disabled>

                            <option value="">
                                Select Province
                            </option>

                        </select>

                        <small
                            class="error-message"
                            id="provinceError">
                        </small>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="city">
                            City / Municipality <span>*</span>
                        </label>

                        <select
                            id="city"
                            required
                            disabled>

                            <option value="">
                                Select City
                            </option>

                        </select>

                        <small
                            class="error-message"
                            id="cityError">
                        </small>

                    </div>


                    <div class="form-group">

                        <label for="barangay">
                            Barangay <span>*</span>
                        </label>

                        <select
                            id="barangay"
                            required
                            disabled>

                            <option value="">
                                Select Barangay
                            </option>

                        </select>

                        <small
                            class="error-message"
                            id="barangayError">
                        </small>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="street">
                            Street <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="street"
                            placeholder="Enter street"
                            required>

                        <small
                            class="error-message"
                            id="streetError">
                        </small>

                    </div>


                    <div class="form-group">

                        <label for="houseNumber">
                            House No. <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="houseNumber"
                            placeholder="Enter house number"
                            required>

                        <small
                            class="error-message"
                            id="houseNumberError">
                        </small>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="postalCode">
                            Postal Code <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="postalCode"
                            placeholder="Enter postal code"
                            maxlength="4"
                            required>

                        <small
                            class="error-message"
                            id="postalCodeError">
                        </small>

                    </div>


                    <div class="form-group">

                        <label for="department">
                            Department <span>*</span>
                        </label>

                        <select
                            id="department"
                            required>

                            <option value="">
                                Select Department
                            </option>

                            <option value="Guidance Office">
                                Guidance Office
                            </option>

                            <option value="Administration">
                                Administration
                            </option>

                            <option value="IT Department">
                                IT Department
                            </option>

                            <option value="Faculty">
                                Faculty
                            </option>

                            <option value="Student">
                                Student
                            </option>

                        </select>

                        <small
                            class="error-message"
                            id="departmentError">
                        </small>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="status">
                            Status <span>*</span>
                        </label>

                        <select
                            id="status"
                            required>

                            <option value="">
                                Select Status
                            </option>

                            <option value="Active">
                                Active
                            </option>

                            <option value="Inactive">
                                Inactive
                            </option>

                            <option value="Pending">
                                Pending
                            </option>

                        </select>

                        <small
                            class="error-message"
                            id="statusError">
                        </small>

                    </div>

                </div>


                <!-- SIGNUP MESSAGE -->

                <div
                    id="signupMessage"
                    class="form-message">
                </div>


                <!-- BUTTONS -->

                <div class="button-group">

                    <button
                        type="submit"
                        class="primary-btn">
                        CREATE USER
                    </button>

                    <button
                        type="button"
                        class="secondary-btn"
                        id="signupBackBtn">
                        BACK
                    </button>

                    <button
                        type="reset"
                        class="secondary-btn">
                        CLEAR
                    </button>

                </div>

            </form>

        </div>

    </div>

</section>


<!-- Firebase / User Access JavaScript -->
<script type="module" src="script.js"></script>


</body>
</html>
